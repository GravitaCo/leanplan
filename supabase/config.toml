# Supabase CLI settings for Tali's Edge Functions (the database is managed in the dashboard; see
# docs/security-rls.sql and docs/migrations/). Only the settings that differ from the defaults.
project_id = "exvblofwiwbvycomxvmj"

[functions.ai-read-label]
# The gateway's JWT check is off (security-data, Sept 2026: we don't depend on the legacy HS256
# path). The function itself rejects a missing or malformed Authorization with 401, and the
# ai_usage_take RPC, called with the caller's JWT before any model call, is the real gate.
verify_jwt = false

[functions.delete-account]
# Same gate as ai-read-label: the gateway's JWT check is off, and the function itself refuses a
# missing or malformed Authorization with 401, then has Auth verify the token (auth.getUser) and
# takes the user id only from that answer. The service role key never leaves the function.
verify_jwt = false
