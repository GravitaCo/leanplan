<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<title>Lean Plan</title>
<style>
  /* ===================== TOKENS =====================
     Surfaces and labels follow iOS system colours; each data type has a
     category colour (Apple Health style). "-ink" variants are the
     contrast-safe versions used for text on light backgrounds. */
  :root{
    color-scheme:light dark;
    --bg:#F2F2F7; --card:#FFFFFF; --elev:#FFFFFF; --sheet:#F2F2F7; --segon:#FFFFFF;
    --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2); --fill3:rgba(118,118,128,.3);
    --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
    --tabbar:rgba(249,249,249,.88); --shadow:0 1px 3px rgba(0,0,0,.05);
    --tint:#007AFF; --red:#FF3B30;
    --energy:#34C759;   --energy-ink:#248A3D;
    --activity:#FF9500; --activity-ink:#C93400;
    --protein:#32ADE6;  --protein-ink:#0071A4;
    --carbs:#5856D6;    --carbs-ink:#3634A3;
    --fat:#FFCC00;      --fat-ink:#A07800;
    --body:#AF52DE;     --body-ink:#8944AB;
    --supps:#FF2D55;    --supps-ink:#D30F45;
    --mind:#30B0C7;     --mind-ink:#007D95;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --elev:#2C2C2E; --sheet:#1C1C1E; --segon:#636366;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32); --fill3:rgba(118,118,128,.44);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --tabbar:rgba(18,18,20,.86); --shadow:none;
    --tint:#0A84FF; --red:#FF453A;
    --energy:#30D158;   --energy-ink:#30D158;
    --activity:#FF9F0A; --activity-ink:#FF9F0A;
    --protein:#64D2FF;  --protein-ink:#64D2FF;
    --carbs:#7D7AFF;    --carbs-ink:#7D7AFF;
    --fat:#FFD60A;      --fat-ink:#FFD60A;
    --body:#BF5AF2;     --body-ink:#BF5AF2;
    --supps:#FF375F;    --supps-ink:#FF375F;
    --mind:#40C8E0;     --mind-ink:#40C8E0;
  }}
  :root[data-theme="dark"]{
    --bg:#000000; --card:#1C1C1E; --elev:#2C2C2E; --sheet:#1C1C1E; --segon:#636366;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32); --fill3:rgba(118,118,128,.44);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --tabbar:rgba(18,18,20,.86); --shadow:none;
    --tint:#0A84FF; --red:#FF453A;
    --energy:#30D158;   --energy-ink:#30D158;
    --activity:#FF9F0A; --activity-ink:#FF9F0A;
    --protein:#64D2FF;  --protein-ink:#64D2FF;
    --carbs:#7D7AFF;    --carbs-ink:#7D7AFF;
    --fat:#FFD60A;      --fat-ink:#FFD60A;
    --body:#BF5AF2;     --body-ink:#BF5AF2;
    --supps:#FF375F;    --supps-ink:#FF375F;
    --mind:#40C8E0;     --mind-ink:#40C8E0;
  }

  /* ===================== BASE ===================== */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--label);
    font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:-.2px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  body.noscroll{overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  [role="button"]{cursor:pointer}
  .num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:0}
  svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  svg.i.sm{width:17px;height:17px}
  svg.chev{width:14px;height:14px;color:var(--label3);stroke-width:2.6}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
  .shim{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);z-index:35;
    background:var(--tabbar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  .sub{font-size:15px;color:var(--label2)}
  .foot{font-size:13px;color:var(--label2);line-height:1.38;padding:7px 16px 0}
  .muted{color:var(--label2)}

  /* ===================== PAGE HEADER ===================== */
  .hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    padding:calc(env(safe-area-inset-top) + 18px) 0 12px}
  .eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.1px;
    display:flex;align-items:center;gap:6px;min-height:20px}
  .ltitle{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0}
  .avatar{width:36px;height:36px;border-radius:50%;border:0;flex:none;margin-bottom:3px;
    background:linear-gradient(180deg,#A5A5AA,#86868B);color:#fff;font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center}
  .avatar.lg{width:64px;height:64px;font-size:26px;margin:0}
  .roundbtn{width:36px;height:36px;border-radius:50%;border:0;flex:none;margin-bottom:3px;
    background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center}
  .roundbtn svg.i{width:20px;height:20px;stroke-width:2.6}
  .daynav{display:inline-flex;align-items:center;gap:2px}
  .daynav button{background:none;border:0;color:var(--tint);padding:0 4px;display:flex}
  .daynav button svg{width:16px;height:16px;stroke-width:2.6}
  .daynav button:disabled{color:var(--label3)}
  .sync{font-weight:500;text-transform:none;color:var(--label3);cursor:pointer}
  .back{background:none;border:0;color:var(--tint);font-size:17px;display:flex;align-items:center;gap:2px;padding:0;margin-left:-6px}
  .back svg{width:22px;height:22px;stroke-width:2.4}

  /* ===================== SECTIONS & CARDS ===================== */
  .sec-t{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:700;
    letter-spacing:.35px;margin:28px 2px 10px}
  .sec-t .lnk{font-size:17px;font-weight:400;letter-spacing:-.2px;color:var(--tint);background:none;border:0;padding:0}
  .card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
    display:block;width:100%;text-align:left;border:0;color:var(--label)}
  .hk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .hk-c{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
  .hk-m{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--label2)}
  .big{font-size:30px;font-weight:700;line-height:1.1}
  .big small{font-size:17px;font-weight:600;color:var(--label2);margin-left:3px}
  .pm{font-size:15px;font-weight:600;color:var(--label2);background:var(--fill);border-radius:8px;padding:2px 7px;
    margin-left:6px;vertical-align:1px;border:0}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  .banner{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px 14px;
    margin-bottom:10px;font-size:15px;line-height:1.35;box-shadow:var(--shadow)}
  .banner .x{margin-left:auto;background:var(--fill);border:0;border-radius:50%;width:24px;height:24px;flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--label2)}
  .banner .x svg{width:12px;height:12px;stroke-width:3}

  /* ===================== WEEK STRIP ===================== */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -4px 12px}
  .wd{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;border-radius:12px;
    padding:6px 0 5px;color:var(--label)}
  .wd.sel{background:var(--card);box-shadow:var(--shadow)}
  .wd .l{font-size:12px;font-weight:600;color:var(--label2)}
  .wd.today .l{color:var(--tint)}
  .wd .rw{position:relative;width:34px;height:34px}
  .wd .rw .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
  .wd.future .rw .num{color:var(--label2)}
  .wd .t{font-size:10px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}
  .wd .t.done{color:var(--activity-ink)}

  /* ===================== RINGS HERO ===================== */
  .hero{display:flex;gap:18px;align-items:center}
  .legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
  .lg .k{font-size:13px;font-weight:600;margin-bottom:1px}
  .lg .v{font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg .v small{font-size:15px;font-weight:600;color:var(--label2)}
  .lg .v .w{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:17px;font-weight:600}
  .hero-f{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:11px;border-top:.5px solid var(--sep);
    font-size:15px;color:var(--label2)}
  .hero-f .grow{flex:1}

  /* ===================== TILES ===================== */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border-radius:14px;padding:12px 14px 13px;border:0;text-align:left;color:var(--label);
    min-height:122px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .tile .hk-c{font-size:14px}
  .tile .v{font-size:24px;font-weight:700;margin-top:auto;line-height:1.1}
  .tile .v small{font-size:15px;font-weight:600;color:var(--label2);margin-left:2px}
  .tile .v .w{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:19px}
  .tile .s{font-size:13px;color:var(--label2);margin-top:3px}
  .dots{display:flex;gap:5px;margin-top:8px}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--fill2)}
  .dots i.on{background:var(--energy)}
  .dots i.fu{background:none;border:1.5px dashed var(--fill3)}

  /* ===================== LISTS (inset grouped) ===================== */
  .list{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px;box-shadow:var(--shadow)}
  .li{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 16px;position:relative;
    background:none;border:0;text-align:left;color:var(--label);font-size:17px}
  .li + .li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .list.icons .li + .li::before{left:58px}
  button.li:active,.li[role="button"]:active{background:var(--fill)}
  .li .m{flex:1;min-width:0}
  .li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .s{font-size:13px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .tr{color:var(--label2);white-space:nowrap}
  .li.act{color:var(--tint)}
  .li select{width:auto;background:none;border:0;padding:0;color:var(--label2);text-align:right;font-size:17px}
  .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .ico svg.i{width:18px;height:18px}
  .grp-h{display:flex;justify-content:space-between;align-items:baseline;padding:22px 4px 8px;font-size:20px;font-weight:700;letter-spacing:.3px}
  .grp-h small{font-size:15px;font-weight:400;color:var(--label2);letter-spacing:-.2px}
  .lbl{font-size:13px;color:var(--label2);text-transform:uppercase;padding:18px 16px 7px;letter-spacing:.1px}
  .addc{width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--tint);border:0;flex:none;
    display:flex;align-items:center;justify-content:center}
  .addc svg.i{width:16px;height:16px;stroke-width:2.8}
  .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--fill3);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
  .chk svg.i{width:15px;height:15px;stroke-width:3.2}
  .chk.on{background:var(--supps);border-color:var(--supps)}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--label2);background:var(--fill);
    border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
  .empty{padding:22px 16px;text-align:center;color:var(--label2);font-size:15px;line-height:1.4}

  /* ===================== MACROS & RANGE BAR ===================== */
  .rbar{position:relative;height:10px;border-radius:5px;background:var(--fill);margin:14px 0 16px}
  .rbar .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--energy);transition:width .3s}
  .rbar .tk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--label2)}
  .macro3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .mc .k{font-size:13px;font-weight:600}
  .mc .v{font-size:17px;font-weight:700;margin-top:1px}
  .mc .v small{font-size:13px;font-weight:600;color:var(--label2)}
  .mc .b{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
  .mc .b i{display:block;height:100%;border-radius:2px}

  /* ===================== CHARTS ===================== */
  svg.bars{width:100%;height:auto;display:block;margin:6px 0 2px}
  svg.bars text{font-size:11px;fill:var(--label2);font-weight:600}
  svg.bars text.on{fill:var(--label)}
  .hl{font-size:15px;line-height:1.38;padding:10px 0 0;border-top:.5px solid var(--sep);margin-top:10px}
  .hl + .hl{margin-top:0}

  /* ===================== CONTROLS ===================== */
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;border:0;border-radius:12px;
    background:var(--tint);color:#fff;font-size:17px;font-weight:600}
  .btn:active{opacity:.7}
  .btn.tinted{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
  .btn.gray{background:var(--fill);color:var(--label)}
  .btn.danger{background:none;color:var(--red);font-weight:400}
  .btn.sm{height:32px;width:auto;padding:0 14px;font-size:15px;border-radius:16px}
  .btn[disabled]{opacity:.4}
  .stack{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
  .seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font-size:13px;font-weight:600;color:var(--label);white-space:nowrap}
  .seg button.on{background:var(--segon);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:0;background:var(--fill);color:var(--label);border-radius:18px;padding:7px 13px;font-size:15px;line-height:1.2;text-align:left}
  .chip small{display:block;font-size:12px;color:var(--label2)}
  .chip.on{background:var(--tint);color:#fff}
  .chip.on small{color:rgba(255,255,255,.8)}
  input,select,textarea{font:inherit;font-size:17px;color:var(--label);background:var(--card);border:0;border-radius:10px;
    padding:11px 12px;width:100%;-webkit-appearance:none;appearance:none}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--tint) 50%,transparent);outline-offset:0}
  .frow{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative}
  .frow + .frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .frow label{flex:none;font-size:17px;min-width:96px}
  .frow input,.frow select{background:none;padding:11px 0;text-align:right;border-radius:0}
  .frow input:focus{outline:none}
  .frow .u{color:var(--label2);font-size:17px}
  .stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:9px}
  .stepper button{background:none;border:0;width:44px;height:34px;font-size:22px;color:var(--label)}
  .stepper span{min-width:52px;text-align:center;font-weight:600}
  input[type=range]{padding:0;height:28px;background:none;accent-color:var(--tint);-webkit-appearance:auto;appearance:auto}
  .gram{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 4px}
  .gram input{width:2.8em;text-align:right;font-size:40px;font-weight:700;background:none;padding:0}
  .gram span{font-size:20px;color:var(--label2);font-weight:600}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale button{border:0;background:var(--card);border-radius:10px;padding:8px 0;font-size:13px;color:var(--label);line-height:1.2}
  .scale button b{display:block;font-size:17px}
  .scale button.on{background:var(--tint);color:#fff}

  /* ===================== SHEETS ===================== */
  #sheetRoot{position:fixed;inset:0;z-index:60;pointer-events:none}
  #sheetRoot.open{pointer-events:auto}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
  #sheetRoot.in .sheet-bg{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--sheet);
    border-radius:14px 14px 0 0;max-height:calc(100vh - env(safe-area-inset-top) - 12px);display:flex;flex-direction:column;
    transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom)}
  #sheetRoot.in .sheet{transform:none}
  .sheet.tall{height:calc(100vh - env(safe-area-inset-top) - 12px)}
  .grabber{width:36px;height:5px;border-radius:3px;background:var(--fill3);margin:6px auto 0;flex:none}
  .sheet-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 16px 10px;flex:none}
  .sh-t{font-size:17px;font-weight:600;text-align:center;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-r{text-align:right}
  .navbtn{background:none;border:0;color:var(--tint);font-size:17px;padding:4px 0;display:inline-flex;align-items:center}
  .navbtn.b{font-weight:600}
  .navbtn svg.i{width:20px;height:20px;stroke-width:2.6;margin-left:-6px}
  .sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 24px;flex:1}
  .sheet .list,.sheet .card,.sheet .scale button{background:var(--elev)}
  .sheet .lbl{padding-left:16px}
  .searchbar{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:38px;color:var(--label2)}
  .searchbar input{background:none;padding:0;height:38px;border-radius:0}
  .searchbar input:focus{outline:none}
  .food-hd .t{font-size:20px;font-weight:700;letter-spacing:.3px}
  .preview{margin-top:14px}
  .prose{font-size:15px;line-height:1.45}
  .prose p{margin:0 0 10px} .prose ul{margin:0 0 10px;padding-left:18px} .prose li{margin-bottom:5px}
  .prose h3{font-size:17px;margin:16px 0 6px}
  .warn{background:color-mix(in srgb,var(--activity) 14%,transparent);border-radius:10px;padding:10px 12px;margin:0 0 10px}

  /* ===================== TRAIN ===================== */
  .ex .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ex .n{font-size:17px;font-weight:600}
  .ex .tg{font-size:13px;font-weight:600;color:var(--activity-ink);background:color-mix(in srgb,var(--activity) 15%,transparent);
    border-radius:6px;padding:2px 7px;white-space:nowrap}
  .ex .cue{font-size:15px;color:var(--label2);margin:6px 0 8px;line-height:1.38}
  .ex .last{font-size:13px;font-weight:600;color:var(--label2);margin-bottom:8px}
  .ex .howto{font-size:15px;color:var(--tint);text-decoration:none;display:inline-block;margin-bottom:10px}
  .sets{display:flex;flex-direction:column;gap:6px}
  .setrow{display:flex;align-items:center;gap:8px}
  .setrow .n{width:48px;font-size:13px;font-weight:600;color:var(--label2)}
  .setrow input{background:var(--fill);padding:9px 10px;text-align:center}
  .setrow .u{font-size:13px;color:var(--label2);width:34px}
  .addset{background:none;border:0;color:var(--tint);font-size:15px;padding:10px 0 0}

  /* ===================== SETTINGS ACCORDION ===================== */
  .acc-bd{padding:4px 16px 16px}
  .acc-bd .field{margin-bottom:10px}
  .acc-bd .field label{display:block;font-size:13px;color:var(--label2);margin-bottom:5px}
  .acc-bd input,.acc-bd select{background:var(--fill)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tog-wrap{position:relative;display:inline-block;width:51px;height:31px;flex:none}
  .tog-wrap input{opacity:0;width:0;height:0;position:absolute}
  .tog-slider{position:absolute;inset:0;background:var(--fill2);border-radius:31px;transition:.2s}
  .tog-slider::before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;
    transition:.2s;box-shadow:0 3px 8px rgba(0,0,0,.15)}
  .tog-wrap input:checked+.tog-slider{background:var(--energy)}
  .tog-wrap input:checked+.tog-slider::before{transform:translateX(20px)}
  .tog-wrap input:disabled+.tog-slider{opacity:.4}

  /* ===================== TAB BAR, TOAST ===================== */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--tabbar);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .in{display:flex;max-width:520px;margin:0 auto}
  nav.tabs button{flex:1;background:none;border:0;padding:7px 0 5px;color:var(--label2);
    display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.1px}
  nav.tabs button svg.i{width:25px;height:25px;stroke-width:1.9}
  nav.tabs button.on{color:var(--tint)}
  nav.tabs button.on svg.i{stroke-width:2.3}
  .toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:70;
    background:var(--elev);color:var(--label);box-shadow:0 8px 30px rgba(0,0,0,.2);padding:10px 16px;border-radius:20px;
    font-size:15px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ===================== AUTH ===================== */
  #authOverlay{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column;align-items:center;
    justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
  .auth-brand{text-align:center;margin-bottom:24px}
  .auth-brand h1{font-size:34px;font-weight:700;letter-spacing:.37px;margin:0 0 4px}
  .auth-brand p{font-size:15px;color:var(--label2);margin:0}
  .auth-card{width:100%;max-width:400px;background:var(--card);border-radius:14px;padding:22px 20px}
  .auth-card .field{margin-bottom:10px}
  .auth-card .field label{display:block;font-size:13px;color:var(--label2);margin-bottom:5px}
  .auth-card input{background:var(--fill)}
  .auth-title{font-size:22px;font-weight:700;margin:0 0 16px}
  .auth-err{background:color-mix(in srgb,var(--red) 12%,transparent);border-radius:10px;color:var(--red);font-size:15px;padding:10px 12px;margin-bottom:12px}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--label2);font-size:13px}
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:.5px;background:var(--sep)}
  .auth-google{background:var(--fill)!important;color:var(--label)!important}
  .auth-link{background:none;border:0;color:var(--tint);font-size:15px;padding:0}
  .auth-icon{font-size:40px;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="shim"></div>
<div id="authOverlay">
  <div class="auth-brand"><h1>Lean Plan</h1><p>Food, training and how you feel, in one place.</p></div>
  <div class="auth-card" id="authBox"></div>
</div>
<div id="app">
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheetRoot"></div>
<nav class="tabs" id="tabs" aria-label="Main">
  <div class="in">
    <button data-tab="today" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>Summary</button>
    <button data-tab="food"><svg class="i" viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M9 3v6M17 21V3c-2 1.5-3 4-3 7v4h3"/></svg>Food</button>
    <button data-tab="train"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train</button>
    <button data-tab="plan"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
    <button data-tab="info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.2-3.8 4-5.8 7.5-5.8s6.3 2 7.5 5.8"/></svg>Profile</button>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
